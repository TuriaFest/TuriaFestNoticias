<header class="nav-bar">
  <div class="nav-bar__inner">
    <a
      class="nav-bar__brand"
      href="https://www.turiafest.com/"
      [attr.aria-label]="'nav.home' | t"
    >
      <img
        class="nav-bar__brand-img nav-bar__brand-img--light"
        ngSrc="assets/branding/festi-val-logo.webp"
        width="800"
        height="580"
        priority
        alt="TuriaFest"
      />
      <img
        class="nav-bar__brand-img nav-bar__brand-img--dark"
        ngSrc="assets/branding/festi-val-logo-dark.webp"
        width="800"
        height="580"
        loading="eager"
        alt=""
        aria-hidden="true"
      />
    </a>

    <nav class="nav-bar__nav" [attr.aria-label]="'nav.aria.primary' | t">
      <ul class="nav-bar__nav-list">
        <li>
          <a
            class="nav-bar__nav-link"
            data-testid="nav-link-inicio"
            href="https://www.turiafest.com/"
          >
            {{ 'nav.home' | t }}
          </a>
        </li>
        <li>
          <a
            class="nav-bar__nav-link"
            data-testid="nav-link-festivales"
            href="https://www.turiafest.com/festivales"
          >
            {{ 'nav.festivals' | t }}
          </a>
        </li>
        <li>
          <a
            class="nav-bar__nav-link"
            data-testid="nav-link-calendario"
            href="https://www.turiafest.com/calendario"
          >
            {{ 'nav.calendar' | t }}
          </a>
        </li>
        <li>
          <a
            class="nav-bar__nav-link"
            data-testid="nav-link-noticias"
            routerLink="/noticias"
            routerLinkActive="nav-bar__nav-link--active"
            #rlaNoticias="routerLinkActive"
            [attr.aria-current]="rlaNoticias.isActive ? 'page' : null"
          >
            {{ 'nav.news' | t }}
          </a>
        </li>
      </ul>
    </nav>

    <div class="nav-bar__actions">
      <div class="nav-bar__language" #langMenuContainer data-testid="nav-language-selector">
        <button
          class="nav-bar__icon-btn nav-bar__language-trigger"
          data-testid="nav-btn-language"
          type="button"
          [attr.aria-label]="'nav.language.label' | t"
          aria-haspopup="menu"
          [attr.aria-expanded]="langMenuOpen()"
          (click)="toggleLangMenu()"
        >
          <img
            class="nav-bar__language-flag"
            [ngSrc]="currentLang().flag"
            [alt]="currentLang().label"
            width="24"
            height="24"
          />
        </button>

        @if (langMenuOpen()) {
          <div class="nav-bar__language-menu" role="menu" data-testid="nav-language-menu">
            @for (lang of languages; track lang.code) {
              <button
                class="nav-bar__language-option"
                [class.nav-bar__language-option--active]="lang.code === activeLang()"
                type="button"
                role="menuitem"
                [attr.aria-current]="lang.code === activeLang() ? 'true' : null"
                [attr.data-testid]="'nav-language-option-' + lang.code"
                (click)="selectLang(lang.code)"
              >
                <img
                  class="nav-bar__language-option-flag"
                  [ngSrc]="lang.flag"
                  [alt]="''"
                  aria-hidden="true"
                  width="20"
                  height="20"
                />
                <span class="nav-bar__language-option-label">{{ lang.label }}</span>
              </button>
            }
          </div>
        }
      </div>

      <button
        class="nav-bar__icon-btn nav-bar__search"
        data-testid="nav-btn-buscar"
        type="button"
        [attr.aria-label]="'nav.search' | t"
        aria-controls="nav-news-search"
        [attr.aria-expanded]="searchOpen()"
        (click)="toggleSearch()"
      >
        <svg lucideSearch aria-hidden="true" focusable="false" size="20" strokeWidth="2"></svg>
      </button>

      <button
        class="nav-bar__icon-btn nav-bar__theme-toggle"
        data-testid="nav-btn-tema"
        type="button"
        [attr.aria-label]="themeLabelKey() | t"
        [attr.aria-pressed]="isDark()"
        (click)="toggleTheme()"
      >
        @if (isDark()) {
          <svg lucideMoon aria-hidden="true" focusable="false" size="20" strokeWidth="2"></svg>
        } @else {
          <svg lucideSun aria-hidden="true" focusable="false" size="20" strokeWidth="2"></svg>
        }
      </button>

      <button
        class="nav-bar__icon-btn nav-bar__menu"
        data-testid="nav-btn-menu"
        type="button"
        [attr.aria-label]="'nav.menu' | t"
      >
        <svg lucideMenu aria-hidden="true" focusable="false" size="22" strokeWidth="2"></svg>
      </button>
    </div>
  </div>

  @if (searchOpen()) {
    <form
      id="nav-news-search"
      class="nav-bar__search-form"
      role="search"
      [attr.aria-label]="'nav.searchForm.label' | t"
      (submit)="submitSearch(); $event.preventDefault()"
    >
      <label class="sr-only" for="nav-news-search-input">
        {{ 'nav.searchForm.label' | t }}
      </label>

      <div class="nav-bar__search-field">
        <svg lucideSearch aria-hidden="true" focusable="false" size="20" strokeWidth="2"></svg>
        <input
          #searchInput
          id="nav-news-search-input"
          class="nav-bar__search-input"
          data-testid="nav-search-input"
          type="search"
          name="buscar"
          autocomplete="off"
          enterkeyhint="search"
          [formControl]="searchControl"
          [placeholder]="'nav.searchForm.placeholder' | t"
        />
      </div>

      <button class="nav-bar__search-submit" data-testid="nav-search-submit" type="submit">
        {{ 'nav.searchForm.submit' | t }}
      </button>
    </form>
  }
</header>
